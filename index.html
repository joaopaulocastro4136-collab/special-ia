    <script>
      // Fica antes de tudo o que carrega arquivo do pacote, para ouvir a falha deles.
      // O index guardado no navegador (ou na rede) pode ser de uma publicação anterior e pedir um arquivo do
      // programa que o site já não tem. Sem isto a tela ficava em "Carregando…" para sempre: aqui a página se
      // recarrega UMA vez buscando o index de novo (o parâmetro `v` fura as cópias guardadas). Vale só para a
      // ABERTURA (até o evento `load`) e só para arquivos do pacote (assets/); depois de aberto, quem cuida de um
      // pedaço que não carrega é `src/app/site/pedaco.ts`, que olha se há trabalho em andamento. A marca no
      // sessionStorage é a mesma de lá e garante que não vira laço.
      (function () {
        function guarda(e) {
          var t = e.target;
          var url = t && (t.src || t.href);
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK') || !url || url.indexOf('/assets/') < 0) return;
          try {
            var chave = 'special-ia.pedaco.recarga';
            var agora = Date.now();
            if (agora - (Number(sessionStorage.getItem(chave)) || 0) < 120000) return;
            sessionStorage.setItem(chave, String(agora));
            var u = new URL(location.href);
            u.searchParams.set('v', agora.toString(36));
            location.replace(u.toString());
          } catch (x) {
            /* sem sessionStorage não há como garantir "uma vez": fica como está */
          }
        }
        addEventListener('error', guarda, true);
        addEventListener('load', function () {
          removeEventListener('error', guarda, true);
        });
      })();
    </script>
